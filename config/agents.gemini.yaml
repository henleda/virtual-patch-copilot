# Model-independence: every agent on Google's flagship — the fourth provider in the cross-model
# scorecard, alongside the all-Claude default (agents.yaml), OpenAI (agents.openai.yaml) and the
# local Ollama model (agents.dgx.yaml). No code change; same LiteLLM + instructor harness:
#   VPCOPILOT_CONFIG=config/agents.gemini.yaml vpcopilot console   (or pick "gemini" in the header)
# Needs GEMINI_API_KEY. timeout matches the OpenAI config for the big triage/generate calls.
#
# If a run shows structured-output validation churn on the large nested discover/triage objects,
# set `mode: json` here — the same escape hatch agents.dgx.yaml documents. Left unset so the
# harness uses its default; flip it per-config rather than globally.
defaults:
  model: gemini/gemini-2.5-pro
  temperature: 0.1
  max_retries: 3
  timeout: 180

agents:
  discover:  { model: gemini/gemini-2.5-pro }
  verify:    { model: gemini/gemini-2.5-pro }
  triage:    { model: gemini/gemini-2.5-pro }
  generate:  { model: gemini/gemini-2.5-pro }
  remediate: { model: gemini/gemini-2.5-pro }
  probe:     { model: gemini/gemini-2.5-pro }
  refine:    { model: gemini/gemini-2.5-pro }
