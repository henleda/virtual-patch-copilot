name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"   # nightly live-smoke + bench-gate
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[deploy,console,dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test (unit — no live tenant/model/network)
        run: pytest -m "not live and not bench" --cov=vpcopilot --cov-report=term-missing --cov-fail-under=65

  # Nightly + manual only. What this job checks is the BENCH-GATE MECHANISM: that a scored run still
  # clears the floors in `bench/BASELINE.md`. It scores a deterministic fixture, so it needs no
  # credentials and spends no model quota.
  #
  # It used to describe itself as a "live smoke + bench-gate" and was handed ANTHROPIC_API_KEY,
  # XC_API_URL, XC_API_TOKEN and XC_NAMESPACE. It never used any of them: `pytest -m "live or bench"`
  # collects exactly ONE test of 739, because **no test in the suite carries `@pytest.mark.live`** —
  # the marker is declared in pyproject.toml and unused. So a green tick every morning attested to
  # tenant and model coverage that did not exist, which is the same "we did not check this" /
  # "this is clean" confusion the pipeline itself refuses to make. The selector, the name and the
  # secrets now match what actually runs.
  #
  # Real live tests behind the `live` marker are tracked in BACKLOG.md; restore the credentials and
  # widen the selector back to "live or bench" when they exist.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[deploy,console,dev]"
      - name: Bench-gate (scores a fixture against BASELINE.md — no tenant, no model)
        run: pytest -m bench
